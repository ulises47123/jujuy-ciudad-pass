# =============================================================================
#  Jujuy Ciudad Pass — nginx
#
#  PLANTILLA: install.sh reemplaza __DOMINIO__, quita las líneas IPv6 si el
#  servidor no tiene IPv6, adapta "http2" a la versión de nginx y la instala en
#  /etc/nginx/conf.d/jujuy-pass.conf (Debian/Ubuntu) o
#  /etc/nginx/http.d/jujuy-pass.conf (Alpine).
#  worker_processes 1 y worker_connections 512 se ajustan en /etc/nginx/nginx.conf.
#
#  Rutas:
#    /                -> /opt/jujuy-pass/actual/web       (panel web, estático)
#    /descargas/      -> /var/www/jujuy-pass/descargas/   (APK de turistas)
#    /api/            -> uvicorn en 127.0.0.1:8000
#
#  Ojo con add_header: si una "location" define su propio add_header, PIERDE
#  todos los del server. Por eso todas las cabeceras se definen una sola vez a
#  nivel server y el Cache-Control se elige con el "map" de abajo.
# =============================================================================

# --- Límites de peticiones por IP -------------------------------------------
# General de la API: 10 por segundo (con ráfagas de 40).
limit_req_zone $binary_remote_addr zone=jcp_api:1m rate=10r/s;
# Login/registro/cambio de contraseña: 10 por minuto. Los GET (p. ej. /auth/yo,
# que el panel consulta en cada página) no cuentan: con clave vacía no se limita.
map $request_method $jcp_clave_auth {
    GET     "";
    HEAD    "";
    default $binary_remote_addr;
}
limit_req_zone $jcp_clave_auth zone=jcp_auth:1m rate=10r/m;
# Consulta/uso de cupones por negocios (frena la fuerza bruta de códigos).
limit_req_zone $binary_remote_addr zone=jcp_cupones:1m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=jcp_conn:1m;

# --- Cache-Control según la ruta ------------------------------------------
map $uri $jcp_cache_control {
    default                                               "no-cache";
    ~^/api/                                               "no-store";
    ~^/descargas/                                         "no-cache";
    ~*\.(?:css|js|mjs)$                                   "public, max-age=3600";
    ~*\.(?:png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf)$   "public, max-age=2592000";
}

upstream jcp_backend {
    server 127.0.0.1:8000;
    keepalive 4;
}

# --- Cualquier nombre que no sea el nuestro (p. ej. entrar por IP): cerrar ---
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

# --- HTTP: solo validación de Let's Encrypt y redirección a HTTPS -----------
server {
    listen 80;
    listen [::]:80;
    server_name __DOMINIO__;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }
    location / {
        return 301 https://__DOMINIO__$request_uri;
    }
}

# --- HTTPS ------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    # JCP_HTTP2_ON
    server_name __DOMINIO__;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/__DOMINIO__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMINIO__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:jcp_ssl:1m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/jujuy-pass.access.log;
    error_log  /var/log/nginx/jujuy-pass.error.log warn;

    root  /opt/jujuy-pass/actual/web;
    index index.html;
    charset utf-8;
    charset_types text/plain text/css application/javascript application/json image/svg+xml;

    # --- Poca RAM / clientes lentos ---
    client_max_body_size 64k;
    client_body_buffer_size 16k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    client_header_timeout 15s;
    client_body_timeout 15s;
    send_timeout 30s;
    keepalive_timeout 30s;
    limit_conn jcp_conn 30;
    limit_conn_status 429;
    limit_req_status 429;
    sendfile on;
    tcp_nopush on;

    # --- Compresión (nivel moderado: el Atom tiene poca CPU) ---
    gzip on;
    gzip_comp_level 4;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;

    # --- Cabeceras de seguridad (valen para TODAS las respuestas) ---
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    # strict-origin-when-cross-origin: los tiles de OpenStreetMap exigen Referer.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org https://*.tile.openstreetmap.org; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header Cache-Control $jcp_cache_control always;

    # --- Proxy hacia uvicorn (lo heredan las location de /api) ---
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Se reemplaza (no se agrega) para que un cliente no pueda falsificar su IP.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    proxy_buffer_size 8k;
    proxy_buffers 8 8k;
    proxy_busy_buffers_size 16k;
    proxy_hide_header Cache-Control;
    proxy_hide_header X-Powered-By;

    # --- Panel web (archivos estáticos) ---
    location / {
        try_files $uri $uri/ =404;
    }

    # Archivos ocultos (.git, .env, ...): nunca.
    location ~ /\.(?!well-known/) {
        return 404;
    }

    # --- APK de turistas ---
    location ^~ /descargas/ {
        alias /var/www/jujuy-pass/descargas/;
        autoindex off;
        types {
            application/vnd.android.package-archive apk;
            text/plain                              txt sha256;
        }
        default_type application/octet-stream;
    }

    # --- API ---
    location ^~ /api/ {
        limit_req zone=jcp_api burst=40 nodelay;
        error_page 429 @jcp_429;
        error_page 413 @jcp_413;
        error_page 502 503 504 =503 @jcp_caido;
        proxy_pass http://jcp_backend;

        location = /api/v1/salud {
            access_log off;
            proxy_pass http://jcp_backend;
        }
        location ^~ /api/v1/auth/ {
            limit_req zone=jcp_auth burst=10 nodelay;
            proxy_pass http://jcp_backend;
        }
        location ^~ /api/v1/negocio/cupones {
            limit_req zone=jcp_cupones burst=15 nodelay;
            proxy_pass http://jcp_backend;
        }
    }

    # Errores de nginx en /api con el mismo formato JSON que el backend.
    location @jcp_429 {
        default_type application/json;
        return 429 '{"error":{"codigo":"DEMASIADOS_INTENTOS","mensaje":"Demasiadas solicitudes. Esperá un momento y volvé a intentar."}}';
    }
    location @jcp_413 {
        default_type application/json;
        return 413 '{"error":{"codigo":"DATOS_INVALIDOS","mensaje":"La solicitud es demasiado grande."}}';
    }
    location @jcp_caido {
        default_type application/json;
        return 503 '{"error":{"codigo":"ERROR_INTERNO","mensaje":"El servicio no está disponible en este momento. Probá de nuevo en unos minutos."}}';
    }
}
